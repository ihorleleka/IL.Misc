# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET build & tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          11.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test all target frameworks with coverage
      run: dotnet test --no-build --no-restore --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
    - name: Validate NuGet package and framework API compatibility
      run: dotnet pack Code/IL.Misc.csproj --no-build --no-restore --configuration Release --output ./nupkg
